name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # devenv runs a quarter of the CPUs' worth of builds at once: one on GitHub's 3-4 CPU runners.
  # The PHP headers' configure scripts are single-threaded, so a cold cache built one at a time
  # takes well over an hour. Run as many builds as there are CPUs (each with one core by default).
  DEVENV_MAX_JOBS: 4

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nix, devenv and the devenv cache. Pulls what a previous run built from ext-php-rs, and
      # pushes what this one builds (outside pull requests, which have no token):
      # cargo-zigbuild, the PHP headers for each target and the real-world extensions are built
      # only when they change. Projects whose nixpkgs is this flake's (the template's) get the
      # headers and cargo-zigbuild from it too.
      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: ext-php-rs
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-skip-push: ${{ github.event_name == 'pull_request' }}

      - name: Build
        run: devenv build

      - name: Collect the archives
        if: matrix.runner == 'ubuntu-latest'
        run: |
          out=$(devenv build outputs.load-tests | jq -r '."outputs.load-tests"')
          mkdir dist
          cp -L "$out"/* dist/

      - name: Upload the archives
        if: matrix.runner == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-tests
          path: dist/
          if-no-files-found: error

  check:
    name: Format, lint and devenv
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: ext-php-rs
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-skip-push: ${{ github.event_name == 'pull_request' }}

      # The flake's outputs (the library has no checks of its own: devenv build runs them).
      - name: Check the flake
        run: nix flake check

      # devenv.nix: the lint script (formatting, actionlint, shellcheck, statix, deadnix), then
      # the example extension built through the devenv module and called from the shell's PHP.
      - name: Lint and test the devenv module
        run: devenv test

  load:
    name: Load PHP ${{ matrix.php }} ${{ matrix.ts }} ${{ matrix.arch }} ${{ matrix.libc }}
    needs: build
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5", "8.6"]
        ts: [nts, zts]
        arch: [x86_64, arm64]
        libc: [glibc, musl]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: load-tests
          path: dist

      - name: Load and test
        run: bash tests/load.sh dist "${{ matrix.php }}" "${{ matrix.ts }}" "${{ matrix.arch }}" "${{ matrix.libc }}"

      - name: Install with PIE and test
        run: bash tests/pie.sh dist "${{ matrix.php }}" "${{ matrix.ts }}" "${{ matrix.arch }}" "${{ matrix.libc }}"

  load-macos:
    name: Load PHP ${{ matrix.php }} ${{ matrix.ts }} arm64 macOS
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5", "8.6"]
        ts: [nts, zts]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
        env:
          phpts: ${{ matrix.ts }}

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: load-tests
          path: dist

      - name: Load and test
        run: bash tests/load-macos.sh dist
