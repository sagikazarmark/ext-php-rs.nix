# Depot CI Migration
# Source: .github/workflows/ci.yaml
#
# Changes made:
# - Dropped the macOS build and the load-macos job: Depot CI has no macOS sandboxes
#   (https://depot.dev/docs/ci/overview). GitHub Actions still runs them.
# - Mapped the other runners to Depot CI labels; unknown labels fall back to x86 depot-ubuntu-latest.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # devenv runs a quarter of the CPUs' worth of builds at once: one on GitHub's 3-4 CPU runners.
  # The PHP headers' configure scripts are single-threaded, so a cold cache built one at a time
  # takes well over an hour. Run as many builds as there are CPUs (each with one core by default):
  # two on the default Depot runners, and the build job overrides it for its larger runners.
  DEVENV_MAX_JOBS: 2
  # Depot's runners do not set $USER, which cachix requires.
  USER: runner

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    env:
      DEVENV_MAX_JOBS: 16
    # A change to every portable build (a pull request, which does not push to the cache)
    # rebuilds them all: over an hour on macOS.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 16 CPUs, as the job's DEVENV_MAX_JOBS assumes.
        runner: [depot-ubuntu-24.04-16, depot-ubuntu-24.04-arm-16]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: ext-php-rs
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-skip-push: ${{ github.event_name == 'pull_request' }}

      - name: Build
        run: devenv build

      - name: Collect the archives
        if: matrix.runner == 'depot-ubuntu-24.04-16'
        run: |
          out=$(devenv build outputs.load-tests | jq -r '."outputs.load-tests"')
          mkdir dist
          cp -rL "$out"/* dist/

      - name: Upload the archives
        if: matrix.runner == 'depot-ubuntu-24.04-16'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-tests
          path: dist/
          if-no-files-found: error

  checks:
    name: Checks
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: ext-php-rs
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-skip-push: ${{ github.event_name == 'pull_request' }}

      # The flake's outputs (the library has no checks of its own: devenv build runs them).
      - name: Check the flake
        run: nix flake check

      # devenv.nix: the lint script (formatting, actionlint, shellcheck, statix, deadnix), then
      # the example extension built through the devenv module and called from the shell's PHP.
      - name: Lint and test the devenv module
        run: devenv test

  load:
    name: Load PHP ${{ matrix.php }} ${{ matrix.ts }} ${{ matrix.arch }} ${{ matrix.libc }}
    needs: build
    runs-on: ${{ matrix.arch == 'arm64' && 'depot-ubuntu-24.04-arm' || 'depot-ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5", "8.6"]
        ts: [nts, zts]
        arch: [x86_64, arm64]
        libc: [glibc, musl]
        # The official images of 8.6 are ZTS only (docker-library/php#1686). load-macos (GitHub Actions only) loads 8.6 NTS.
        exclude:
          - php: "8.6"
            ts: nts

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: load-tests
          path: dist

      - name: Load and test
        run: bash tests/load.sh dist "${{ matrix.php }}" "${{ matrix.ts }}" "${{ matrix.arch }}" "${{ matrix.libc }}"

      - name: Install with PIE and test
        run: bash tests/pie.sh dist "${{ matrix.php }}" "${{ matrix.ts }}" "${{ matrix.arch }}" "${{ matrix.libc }}"
